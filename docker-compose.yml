services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env.example
    volumes:
      - relay60_sqlite_data:/app/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/relay60.db
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  relay60_sqlite_data: {}
